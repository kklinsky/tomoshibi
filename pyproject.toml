[project]
name = "tomoshibi"
version = "0.0.1"
description = "A simple, friendly voice companion for older adults living with memory loss"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "faster-whisper>=1.1",
    "huggingface-hub>=0.24",
    "kokoro-onnx>=0.6.1",
    "moonshine-voice>=0.1.5",
    "numpy>=1.26",
    "piper-tts>=1.3",
    "pyyaml>=6.0",
]

[project.scripts]
tomoshibi = "tomoshibi.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

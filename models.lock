    "model/base-en/quantized/base-en/encoder_model.ort",
    "model/base-en/quantized/base-en/decoder_model_merged.ort",
    "model/base-en/quantized/base-en/tokenizer.bin",
]

[models.moonshine-small-streaming-en]

# Kokoro-82M (Apache-2.0) through kokoro-onnx: the int8 quantized export plus a few
# American English voices. `voice` is the one used unless a caller picks another.
[models.kokoro-82m-int8]
kind = "tts"
engine = "kokoro"
voice = "af_heart"
repo = "onnx-community/Kokoro-82M-v1.0-ONNX"
revision = "1939ad2a8e416c0acfeecc08a694d14ef25f2231"
files = [
    "onnx/model_quantized.onnx",
    "voices/af_heart.bin",
    "voices/af_bella.bin",
    "voices/am_michael.bin",
    "voices/am_fenrir.bin",
]

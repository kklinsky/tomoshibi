# Tomoshibi configuration. Copied to /etc/tomoshibi/config.yaml by install.sh.
# Secrets (API keys, Slack tokens) go in /etc/tomoshibi/secrets.env, not here.
# Most settings are not used yet; they mirror docs/DESIGN.md so the shape is settled early.

audio:
  device: "plughw:CARD=USB"           # ALSA device for the USB speakerphone

speech:
  stt_model: whisper-base-en          # name from models.lock
  tts_model: kokoro-82m-int8
  tts_voice: am_fenrir
  tts_speed: 1.1                      # >1.0 is slower

conversation:
  first_listen_window: 8s             # after a button press, how long to wait for speech
  follow_up_window: 10s
  end_of_speech_silence: 1.5s

reminders:
  listen_window: 30s
  retries: 2
  retry_interval: 5m

quiet_hours:
  start: "00:00"
  end: "07:00"

llm:
  primary:  { provider: anthropic, model: claude-haiku-5-5, effort: low }   # low effort: speech starts sooner
  fallback: { provider: ollama, model: "qwen2.5:1.5b", base_url: "http://localhost:11434" }

internet:
  web_search: { enabled: true, backend: brave, max_searches_per_turn: 2, safe_search: strict }
  fetch_page: { enabled: true }
  weather:    { enabled: true }
  news:       { enabled: true }

messaging:
  enabled: true
  contacts: [karen, david]            # people.yaml ids the device may message

privacy:
  daily_summary: false                # short daily summary to the family (never transcripts)

updates:
  channel: stable
  check: daily
  auto_install: false
